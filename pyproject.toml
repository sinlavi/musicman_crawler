[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "musicman-crawler"
version = "1.0.0"
description = "High-performance distributed music crawler and Telegram bot service"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = "."
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
