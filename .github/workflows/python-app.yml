name: MusicMan Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: musicman-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker ${{ matrix.instance }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3]
    permissions:
      contents: read
    env:
      BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
      BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      LRCLIB_APP_ID: ${{ secrets.LRCLIB_APP_ID }}
      LRCLIB_API_KEY: ${{ secrets.LRCLIB_API_KEY }}
      PROXY: socks5h://127.0.0.1:1080
      OFFLINE_MODE: ${{ secrets.OFFLINE_MODE }}
      INFO_CHANNEL_ID: ${{ secrets.INFO_CHANNEL_ID }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      INSTANCE_ID: ${{ matrix.instance }}
      TOTAL_INSTANCES: 3
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache FFmpeg binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/ffmpeg-bin
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ffmpeg-static-linux64-${{ runner.os }}-v1
          restore-keys: |
            ffmpeg-static-linux64-${{ runner.os }}-

      - name: Install FFmpeg from static build
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ffmpeg-bin"
          cd "$HOME/ffmpeg-bin"
          archive="ffmpeg-master-latest-linux64-gpl.tar.xz"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$archive"
          wget --timeout=60 --tries=3 --retry-connrefused --no-verbose "$url"
          tar -xf "$archive"
          install -m 0755 ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
          install -m 0755 ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
          rm -rf ffmpeg-master-latest-linux64-gpl "$archive"

      - name: Verify FFmpeg
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -f lavfi -i nullsrc=s=32x32:d=0.1 -f null - >/dev/null 2>&1

      - name: Cache WARP Docker image
        id: cache-warp
        uses: actions/cache@v4
        with:
          path: /tmp/warp-image.tar
          key: warp-image-caomingjun-warp-${{ runner.os }}-v1
          restore-keys: |
            warp-image-caomingjun-warp-${{ runner.os }}-

      - name: Load cached WARP image
        if: steps.cache-warp.outputs.cache-hit == 'true'
        run: docker load --input /tmp/warp-image.tar

      - name: Pull and cache WARP image
        if: steps.cache-warp.outputs.cache-hit != 'true'
        run: |
          docker pull caomingjun/warp
          docker save caomingjun/warp --output /tmp/warp-image.tar

      - name: Start Cloudflare WARP proxy
        run: |
          docker rm -f warp 2>/dev/null || true
          docker volume rm warp-data 2>/dev/null || true
          docker network inspect warp-net >/dev/null 2>&1 || docker network create warp-net
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          for attempt in {1..30}; do
            if curl -x socks5h://127.0.0.1:1080 \
              https://cloudflare.com/cdn-cgi/trace --max-time 5 --silent |
              grep -q "warp=on"; then
              echo "WARP proxy is ready"
              break
            fi
            echo "Waiting for WARP ($attempt/30)"
            sleep 5
          done
          curl -x socks5h://127.0.0.1:1080 \
            https://cloudflare.com/cdn-cgi/trace --max-time 10 --silent |
            grep -E "^(ip|warp)=" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Restore crawler cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            .cache
            ~/.cache/yt-dlp
          key: crawler-${{ runner.os }}-${{ matrix.instance }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            crawler-${{ runner.os }}-${{ matrix.instance }}-
            crawler-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify YouTube cookies
        run: |
          set -euo pipefail
          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          fi
          if [[ ! -s cookies.txt ]]; then
            echo "::error::YouTube cookies are missing. Add the YOUTUBE_COOKIES Actions secret with the complete Netscape cookies.txt content."
            exit 1
          fi
          if ! grep -q '^# Netscape HTTP Cookie File' cookies.txt; then
            echo "::error::YOUTUBE_COOKIES is not a valid Netscape cookies.txt file."
            exit 1
          fi
          echo "YouTube cookies.txt is present"

      - name: Run worker
        run: python main.py
