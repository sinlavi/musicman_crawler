name: MusicMan Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: musicman-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker ${{ matrix.instance }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3]
    permissions:
      contents: read
    env:
      BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
      BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      PROXY: ${{ secrets.PROXY }}
      OFFLINE_MODE: ${{ secrets.OFFLINE_MODE }}
      INFO_CHANNEL_ID: ${{ secrets.INFO_CHANNEL_ID }}
      INSTANCE_ID: ${{ matrix.instance }}
      TOTAL_INSTANCES: 3
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Restore crawler cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            .cache
            ~/.cache/yt-dlp
          key: crawler-${{ runner.os }}-${{ matrix.instance }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            crawler-${{ runner.os }}-${{ matrix.instance }}-
            crawler-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run worker
        run: python main.py
