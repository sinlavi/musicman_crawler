name: MusicMan Worker 3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # every hour at :30
  push:
      branches: [main]

concurrency:
  group: musicman-worker-3
  # New hourly run cancels the previous in-progress run for this worker.
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 3
    secrets: inherit
