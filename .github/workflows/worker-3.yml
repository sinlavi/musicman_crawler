name: MusicMan Worker 3

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Keep the schedule only if you want a fallback. When auto‑restart is active,
  # the schedule can queue extra runs and cause overlap.
  # schedule:
  #   - cron: "30 * * * *"

concurrency:
  group: musicman-worker-3
  # Do NOT cancel the running job when the next run is triggered.
  # Otherwise the auto‑restart would cancel the very run that dispatched it.
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 3
    secrets: inherit

  restart:
    needs: run
    # Restart on success, failure, or timeout, but not if the user cancels.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger next run
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          # Optional short delay to avoid tight restart loops when the worker
          # finishes very quickly (e.g. no work available).
          sleep 60
          gh workflow run worker-3.yml --ref main
