name: MusicMan Worker 3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"      # every hour at minute 0 (UTC)
  push:
    branches: [main]

concurrency:
  group: musicman-worker-3
  cancel-in-progress: false   # let the running worker finish; the next run queues behind it

jobs:
  run:
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 3
    secrets: inherit
