
name: MusicMan Worker 3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]

concurrency:
  group: musicman-worker-3
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ALL previous workflow runs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: worker-3.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "Fetching all workflow runs..."

          ALL_RUNS=$(gh api --paginate \
            --jq '.workflow_runs[] | [.id, .status] | @tsv' \
            "repos/${GH_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100")

          COUNT=0

          while IFS=$'\t' read -r RUN_ID STATUS; do
            [ -z "$RUN_ID" ] && continue

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              continue
            fi

            if [ "$STATUS" != "completed" ]; then
              echo "Skipping active run: $RUN_ID ($STATUS)"
              continue
            fi

            echo "Deleting old run: $RUN_ID"

            gh api --method DELETE \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}"

            COUNT=$((COUNT + 1))

          done <<< "$ALL_RUNS"

          echo "Cleanup completed. Deleted $COUNT runs."

  run:
    needs: cleanup
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 3
    secrets: inherit

  retry:
    needs: run
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Automatically restart on failure
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run "MusicMan Worker 3" --ref main
