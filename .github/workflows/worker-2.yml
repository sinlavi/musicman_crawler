name: MusicMan Worker 2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # every hour at :20
  # push:
  #   branches: [main]

concurrency:
  group: musicman-worker-2
  # New hourly run cancels the previous in-progress run for this worker.
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 2
    secrets: inherit
