
name: MusicMan Worker 2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]

concurrency:
  group: musicman-worker-2
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          OLD_RUNS=$(gh run list \
            --workflow "MusicMan Worker 2" \
            --limit 1000 \
            --json databaseId,status,createdAt \
            --jq '
              map(select(.status == "completed"))
              | sort_by(.createdAt)
              | reverse
              | .[10:]
              | .[].databaseId
            ')

          while IFS= read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            gh run delete "$RUN_ID" --repo "$GH_REPO" || true
          done <<< "$OLD_RUNS"

  run:
    needs: cleanup
    uses: ./.github/workflows/musicman-worker.yml
    with:
      instance: 2
    secrets: inherit

  retry:
    needs: run
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Restart on failure
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run "MusicMan Worker 2" --ref main
